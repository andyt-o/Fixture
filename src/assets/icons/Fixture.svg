      <stop stop-color="#BDF9F6"/>
      <stop offset=".5" stop-color="#9AE4E1"/>
      <stop offset="1" stop-color="#C0FAEB"/>
    </linearGradient>
    <linearGradient id="teal" x1="51" y1="155" x2="287" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AE8DE"/>
      <stop offset=".52" stop-color="#55B6AF"/>
      <stop offset="1" stop-color="#99E4D4"/>
