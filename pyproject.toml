[project]
name = "fixture"
version = "0.1.0"
description = "Fixture LLM service with LangChain and LangGraph"
readme = "README.md"
authors = [
    { name = "andyt-o", email = "andy.thai2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langchain-openai==1.6.6",
    "python-dotenv==1.2.3",
]

[project.scripts]
fixture = "fixture:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
