[package]
name = "fixture"
version = "0.1.0"
edition = "2021"
authors = ["andy"]
license = "MIT"
description = "Fixture overlay application — Tauri backend"
readme = "../README.md"

[dependencies]
tauri = { version = "=2.12", features = ["image-png", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
reqwest = { version = "0.13", features = ["form", "json"] }
oauth2 = { version = "5.0" }
keyring = { version = "4.2" }
tokio = { version = "1.53", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]

[lib]
name = "fixture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
